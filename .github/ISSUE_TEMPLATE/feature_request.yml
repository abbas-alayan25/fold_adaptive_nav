name: Feature request
description: Something the package should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The screen or flow, and the devices it should work on.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
