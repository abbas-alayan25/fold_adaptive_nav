name: fold_adaptive_nav_ios
description: >-
  iOS implementation of fold_adaptive_nav: hinge posture, fold and camera
  regions, size classes and the vertical system bar on iPhone Duo.
version: 1.0.0
repository: https://github.com/your-org/fold_adaptive_nav/tree/main/fold_adaptive_nav_ios
topics: [foldable, adaptive, navigation]

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    implements: fold_adaptive_nav
    platforms:
      ios:
        pluginClass: FoldAdaptiveNavIosPlugin
        dartPluginClass: FoldAdaptiveNavIos

dependencies:
  flutter:
    sdk: flutter
  fold_adaptive_nav_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
