name: fold_adaptive_nav
description: >-
  Detects foldables and their posture on iOS and Android, and adapts navigation
  by itself: bottom bar on phones, thumb rail on cover displays, tablet layouts
  when open.
version: 1.4.0
repository: https://github.com/abbas-alayan25/fold_adaptive_nav/tree/main/fold_adaptive_nav
topics: [foldable, adaptive, navigation, responsive]

screenshots:
  - description: Closed iPhone Duo. Tabs move to a rail under the thumb; posture, hinge angle and camera regions come from UIKit.
    path: screenshots/ios_cover_tabs.jpg
  - description: Opened Pixel Fold. The list and the open message sit side by side, split at the fold.
    path: screenshots/android_open_list_detail.jpg
  - description: A flow on the Pixel Fold cover display. The actions move into a thumb column on the right.
    path: screenshots/android_cover_flow.jpg
  - description: Pixel Fold half open in tabletop posture. The video stays above the fold, the controls below it.
    path: screenshots/android_tabletop.jpg
  - description: Fold the Pixel Fold with a message open and it stays open, now with a back button.
    path: screenshots/android_cover_detail.jpg
  - description: Tabs beyond the rail's limit go behind More, here as a sheet on the iPhone Duo cover display.
    path: screenshots/ios_cover_more.jpg
  - description: Opened iPhone Duo on its side, with More as a menu above the floating bottom bar.
    path: screenshots/ios_open_more.jpg
  - description: Closed Pixel Fold. The same rail, with a badge on Inbox, on Android's cover display.
    path: screenshots/android_cover_tabs.jpg
  - description: A media screen on the iPhone Duo cover display, with the rail beside it.
    path: screenshots/ios_cover_player.jpg
  - description: Opened iPhone Duo. The tablet layout with a floating bottom bar.
    path: screenshots/ios_open_tabs.jpg

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    platforms:
      ios:
        default_package: fold_adaptive_nav_ios
      android:
        default_package: fold_adaptive_nav_android

dependencies:
  flutter:
    sdk: flutter
  fold_adaptive_nav_platform_interface: ^1.0.0
  fold_adaptive_nav_ios: ^1.0.0
  fold_adaptive_nav_android: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
