name: fold_adaptive_nav
description: >-
  Detects foldables and their posture on iOS and Android, and adapts navigation
  by itself: bottom bar on phones, thumb rail on cover displays, tablet layouts
  when open.
version: 1.7.0
repository: https://github.com/abbas-alayan25/fold_adaptive_nav/tree/main/fold_adaptive_nav
issue_tracker: https://github.com/abbas-alayan25/fold_adaptive_nav/issues
topics: [foldable, adaptive, navigation, responsive, layout]

screenshots:
  - description: Folding, unfolding and turning the iPhone Duo. The tabs move from a rail under the thumb to a side bar, then to a bottom bar in split screen.
    path: screenshots/demo.gif
  - description: Closed iPhone Duo. The tabs sit in a rail under the right thumb, with a badge on Inbox.
    path: screenshots/ios_cover_inbox.jpg
  - description: Opened iPhone Duo. The tabs move to a side bar on the left.
    path: screenshots/ios_open_side_bar.jpg
  - description: Opened iPhone Duo on its side. The side bar, the list and an empty detail pane.
    path: screenshots/ios_open_side_bar_landscape.jpg
  - description: Opened iPhone Duo in split screen. The app gets the phone layout, with a floating bottom bar.
    path: screenshots/ios_split_screen.jpg
  - description: A flow on the closed iPhone Duo. Continue sits in a thumb column on the right.
    path: screenshots/ios_cover_flow.jpg
  - description: The same flow opened on its side. The amounts and Continue move to a side panel.
    path: screenshots/ios_open_flow_panel.jpg
  - description: The same flow opened upright. Continue is pinned to the bottom, full width.
    path: screenshots/ios_open_flow.jpg
  - description: The same flow in split screen, laid out like a phone.
    path: screenshots/ios_split_screen_flow.jpg
  - description: Pixel Fold half open in tabletop posture. The video stays above the fold, the controls below it.
    path: screenshots/android_tabletop.jpg

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    platforms:
      ios:
        default_package: fold_adaptive_nav_ios
      android:
        default_package: fold_adaptive_nav_android

dependencies:
  flutter:
    sdk: flutter
  fold_adaptive_nav_platform_interface: ^1.0.0
  fold_adaptive_nav_ios: ^1.0.0
  fold_adaptive_nav_android: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
